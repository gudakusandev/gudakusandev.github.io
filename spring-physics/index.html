<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>実験: バネ質点物理シミュレーション</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#101623;
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:#dbe7f5;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #cv { position:absolute; inset:0; display:block; touch-action:none; cursor:grab; }
  #cv.grabbing { cursor:grabbing; }
  #ui { position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:8px; z-index:10; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .label { font-size:11px; color:#8fa8c8; margin-right:2px; letter-spacing:.05em; }
  button { background:rgba(24,36,58,.88); color:#cfe2f7; border:1px solid #33507c;
    border-radius:8px; padding:7px 11px; font-size:12.5px; cursor:pointer; line-height:1;
    transition:background .15s,border-color .15s,color .15s; }
  button:hover { background:rgba(38,58,92,.92); }
  button.on { background:#1d5fae; border-color:#4da3ff; color:#fff; }
  #info { position:absolute; top:10px; right:10px; text-align:right; font-size:11.5px;
    color:#8fa8c8; z-index:10; line-height:1.7; pointer-events:none; }
  #info b { color:#dbe7f5; font-weight:600; }
  #legend { position:absolute; right:10px; bottom:12px; z-index:10; display:none;
    font-size:11px; color:#aebfd8; background:rgba(16,22,35,.72); padding:8px 10px; border-radius:8px; }
  #legend .bar { width:170px; height:10px; border-radius:5px; margin:5px 0 3px;
    background:linear-gradient(90deg,#2f6bff 0%,#6fb7ff 28%,#a9c6de 50%,#ffb03a 76%,#ff3b30 100%); }
  #legend .cap { display:flex; justify-content:space-between; }
  #hint { position:absolute; left:10px; bottom:12px; font-size:11.5px; color:#7188a8; z-index:10; pointer-events:none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui">
  <div class="row">
    <span class="label">構造物</span>
    <button data-preset="jelly" class="on">ゼリーキューブ</button>
    <button data-preset="tower">タワー</button>
    <button data-preset="bridge">橋</button>
    <button data-preset="ball">ゼリーボール</button>
  </div>
  <div class="row">
    <button id="btnStress">応力表示: OFF</button>
    <button id="btnSlow">スローモーション: OFF</button>
    <button id="btnReset">リセット</button>
  </div>
</div>

<div id="info">
  質点 <b id="statP">0</b> / バネ <b id="statC">0</b><br>
  最大応力 <b id="statS">0%</b>
</div>

<div id="legend">
  バネの応力（伸縮率）
  <div class="bar"></div>
  <div class="cap"><span>圧縮（縮む）</span><span>引張（伸びる）</span></div>
</div>

<div id="hint">ドラッグで質点を掴んで引っ張る／放して投げる</div>

<script>
'use strict';
/* ============================================================
   バネ質点物理シミュレーション
   - 積分: Verlet 積分（位置ベース）
   - ソルバ: 距離制約（バネ）を Gauss-Seidel 的に反復解決
   - 応力表示: バネの伸縮率 strain = (len-rest)/rest を色に変換
     圧縮(負) = 青 / ほぼ0 = 中間色 / 引張(正) = 赤
   描画は Canvas2D のみ（WebGPU不使用）。
   ============================================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- 物理状態 ---------------- */
let points = [];       // {x,y,px,py,pin}
let springs = [];      // {a,b,rest,stiff,disp} disp=表示用に平滑化した strain
let floorY = 0;

const GRAV = 1500;          // px/s^2
const DAMP = 0.999;         // 速度減衰
const SUBSTEPS = 3;         // 1フレームあたりの物理サブステップ
const ITER = 5;             // サブステップあたりの制約反復回数
let timeScale = 1;          // スロー時は 0.12
let stressMode = false;

function addPoint(x, y, pin) {
  points.push({ x:x, y:y, px:x, py:y, pin:!!pin });
  return points.length - 1;
}
function addSpring(a, b, stiff) {
  const A = points[a], B = points[b];
  const rest = Math.hypot(B.x - A.x, B.y - A.y);
  springs.push({ a:a, b:b, rest:rest, stiff:(stiff === undefined ? 1 : stiff), disp:0 });
}

/* グリッド状の塊（ゼリー系）を作る: 構造バネ＋せん断バネ＋曲げバネ */
function buildGrid(ox, oy, cols, rows, sp, stiff, shearStiff) {
  const idx = [];
  for (let r = 0; r < rows; r++) {
    idx.push([]);
    for (let c = 0; c < cols; c++) idx[r].push(addPoint(ox + c * sp, oy + r * sp, false));
  }
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (c + 1 < cols) addSpring(idx[r][c], idx[r][c + 1], stiff);
    if (r + 1 < rows) addSpring(idx[r][c], idx[r + 1][c], stiff);
    if (c + 1 < cols && r + 1 < rows) {
      addSpring(idx[r][c], idx[r + 1][c + 1], shearStiff);
      addSpring(idx[r][c + 1], idx[r + 1][c], shearStiff);
    }
    if (c + 2 < cols) addSpring(idx[r][c], idx[r][c + 2], stiff * 0.7);
    if (r + 2 < rows) addSpring(idx[r][c], idx[r + 2][c], stiff * 0.7);
  }
  return idx;
}

/* ---------------- プリセット ---------------- */
function clearWorld() { points = []; springs = []; grab.i = -1; }

function presetJelly() {
  clearWorld();
  const sp = 27, cols = 11, rows = 10;
  buildGrid(W / 2 - (cols - 1) * sp / 2, H * 0.34, cols, rows, sp, 0.85, 0.6);
  // もう一つ小さい塊を上に落として重ねる
  buildGrid(W / 2 - 2.5 * sp, H * 0.34 - 6 * sp - 14, 6, 6, sp, 0.85, 0.6);
}

function presetTower() {
  clearWorld();
  const sp = 30, cols = 4, rows = 15;
  const ox = W / 2 - (cols - 1) * sp / 2, oy = floorY - (rows - 1) * sp - 2;
  buildGrid(ox, oy, cols, rows, sp, 1.0, 0.95);
  // 横に倒れ込み台として小さな塊も置く
  buildGrid(ox - 6 * sp, floorY - 3 * sp - 2, 4, 3, sp, 0.9, 0.7);
}

function presetBridge() {
  clearWorld();
  const deckY = H * 0.52, sp = 30;
  const x0 = W * 0.14, x1 = W * 0.86;
  // 両岸の塔（上端を固定）
  function tower(cx) {
    const idx = [];
    const rows = 7, cols = 3;
    for (let r = 0; r < rows; r++) {
      idx.push([]);
      for (let c = 0; c < cols; c++) {
        const pin = (r === 0); // 最上段を固定（岸に埋め込み）
        idx[r].push(addPoint(cx + (c - 1) * sp, deckY - (rows - 1 - r) * sp + 4 * sp, pin));
      }
    }
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (c + 1 < cols) addSpring(idx[r][c], idx[r][c + 1], 1);
      if (r + 1 < rows) addSpring(idx[r][c], idx[r + 1][c], 1);
      if (c + 1 < cols && r + 1 < rows) {
        addSpring(idx[r][c], idx[r + 1][c + 1], 0.9);
        addSpring(idx[r][c + 1], idx[r + 1][c], 0.9);
      }
    }
    return idx[0][1]; // 塔の頂点（中央）
  }
  const topL = tower(x0), topR = tower(x1);
  // 橋桁（少し垂れたデッキ）
  const n = 17, deck = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const x = x0 + (x1 - x0) * t;
    const sag = Math.sin(Math.PI * t) * 16;
    deck.push(addPoint(x, deckY + sag, false));
  }
  for (let i = 0; i + 1 < n; i++) {
    addSpring(deck[i], deck[i + 1], 1);
    // 桁の下弦（トラス化）
  }
  // メインケーブル: 頂点→デッキ各点（吊り材）＋頂点間ケーブル
  const cableTop = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const x = x0 + (x1 - x0) * t;
    const y = (deckY - 2.2 * sp) + Math.sin(Math.PI * t) * 1.1 * sp;
    cableTop.push(addPoint(x, y, false));
    addSpring(cableTop[i], deck[i], 0.95); // ハンガー
    if (i > 0) addSpring(cableTop[i - 1], cableTop[i], 1); // ケーブル本体
  }
  addSpring(topL, cableTop[0], 1);
  addSpring(topR, cableTop[n - 1], 1);
  // 中央にゼリー塊を載せて荷重にする
  buildGrid(W / 2 - 2 * 26, deckY - 4 * 26 - 6, 5, 4, 26, 0.85, 0.6);
}

function presetBall() {
  clearWorld();
  function jellyBall(cx, cy, R) {
    const center = addPoint(cx, cy, false);
    const N = 22, ring = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      ring.push(addPoint(cx + Math.cos(a) * R, cy + Math.sin(a) * R, false));
    }
    for (let i = 0; i < N; i++) {
      addSpring(ring[i], ring[(i + 1) % N], 0.9);
      addSpring(ring[i], ring[(i + 2) % N], 0.7);
      addSpring(center, ring[i], 0.75);
    }
    return center;
  }
  jellyBall(W / 2 - 130, H * 0.34, 74);
  jellyBall(W / 2 + 120, H * 0.26, 54);
  // 下に受け台の塊
  buildGrid(W / 2 - 3 * 28, floorY - 2 * 28 - 2, 7, 2, 28, 0.95, 0.8);
}

const PRESETS = { jelly: presetJelly, tower: presetTower, bridge: presetBridge, ball: presetBall };
let currentPreset = 'jelly';

function reset() {
  floorY = H - 46;
  PRESETS[currentPreset]();
  document.getElementById('statP').textContent = points.length;
  document.getElementById('statC').textContent = springs.length;
}

/* ---------------- 物理ステップ ---------------- */
function stepPhysics(dt) {
  const g = GRAV * dt * dt;
  // Verlet 積分
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.pin) { p.px = p.x; p.py = p.y; continue; }
    if (grab.i === i) continue; // 掴んでいる点はポインタで制御
    const vx = (p.x - p.px) * DAMP;
    const vy = (p.y - p.py) * DAMP;
    p.px = p.x; p.py = p.y;
    p.x += vx;
    p.y += vy + g;
  }
  // 掴んでいる点: ポインタへ追従（速度も与えて投げられるように）
  if (grab.i >= 0) {
    const p = points[grab.i];
    const nx = p.x + (grab.x - p.x) * 0.65;
    const ny = p.y + (grab.y - p.y) * 0.65;
    p.px = p.x - (nx - p.x) * 0.9; // 移動分を速度として残す
    p.py = p.y - (ny - p.y) * 0.9;
    p.x = nx; p.y = ny;
  }
  // 制約反復ソルバ
  for (let it = 0; it < ITER; it++) {
    for (let s = 0; s < springs.length; s++) {
      const sp = springs[s];
      const A = points[sp.a], B = points[sp.b];
      let dx = B.x - A.x, dy = B.y - A.y;
      let d = Math.sqrt(dx * dx + dy * dy);
      if (d < 1e-6) continue;
      const diff = (d - sp.rest) / d * 0.5 * sp.stiff;
      dx *= diff; dy *= diff;
      const wa = A.pin ? 0 : 1, wb = B.pin ? 0 : 1, wsum = wa + wb;
      if (wsum === 0) continue;
      if (wa) { A.x += dx * (2 * wa / wsum); A.y += dy * (2 * wa / wsum); }
      if (wb) { B.x -= dx * (2 * wb / wsum); B.y -= dy * (2 * wb / wsum); }
    }
    // 地面・壁との衝突
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.pin) continue;
      if (p.y > floorY) {
        p.y = floorY;
        // 摩擦: 床に触れたら水平の前位置を寄せて滑りを抑える
        p.px += (p.x - p.px) * 0.35;
      }
      if (p.y < 4) p.y = 4;
      if (p.x < 4) p.x = 4;
      if (p.x > W - 4) p.x = W - 4;
    }
  }
}

/* strain（伸縮率）を計算し、表示用に時間平滑化 */
let maxStrain = 0;
function updateStrain() {
  maxStrain = 0;
  for (let s = 0; s < springs.length; s++) {
    const sp = springs[s];
    const A = points[sp.a], B = points[sp.b];
    const d = Math.hypot(B.x - A.x, B.y - A.y);
    const strain = (d - sp.rest) / sp.rest;
    sp.disp += (strain - sp.disp) * 0.35;
    const a = Math.abs(strain);
    if (a > maxStrain) maxStrain = a;
  }
}

/* ---------------- 描画 ---------------- */
/* strain -> 色: -0.35以下=濃青, 0=中間色, +0.35以上=赤。滑らかに補間 */
function strainColor(strain, out) {
  let t = strain / 0.35;
  if (t > 1) t = 1; else if (t < -1) t = -1;
  let r, g, b;
  if (t < 0) { // 圧縮: 中間(169,198,222) -> 青(47,107,255)
    const u = -t;
    r = 169 + (47 - 169) * u; g = 198 + (107 - 198) * u; b = 222 + (255 - 222) * u;
  } else {     // 引張: 中間 -> 橙 -> 赤(255,59,48)
    const u = t;
    r = 169 + (255 - 169) * u; g = 198 + (59 - 198) * u * u; b = 222 + (48 - 222) * u;
  }
  out[0] = r | 0; out[1] = g | 0; out[2] = b | 0;
  return out;
}
const _c = [0, 0, 0];

function draw() {
  ctx.fillStyle = '#101623';
  ctx.fillRect(0, 0, W, H);
  // 床
  ctx.fillStyle = '#1a2740';
  ctx.fillRect(0, floorY, W, H - floorY);
  ctx.fillStyle = '#33507c';
  ctx.fillRect(0, floorY, W, 2);

  ctx.lineCap = 'round';
  if (stressMode) {
    for (let s = 0; s < springs.length; s++) {
      const sp = springs[s], A = points[sp.a], B = points[sp.b];
      strainColor(sp.disp, _c);
      ctx.strokeStyle = 'rgb(' + _c[0] + ',' + _c[1] + ',' + _c[2] + ')';
      ctx.lineWidth = 2 + Math.min(3, Math.abs(sp.disp) * 9);
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    }
  } else {
    ctx.strokeStyle = 'rgba(110,200,255,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let s = 0; s < springs.length; s++) {
      const sp = springs[s], A = points[sp.a], B = points[sp.b];
      ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
    }
    ctx.stroke();
  }
  // 質点
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    ctx.fillStyle = p.pin ? '#ffd166' : (i === grab.i ? '#ffffff' : '#d9f2ff');
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.pin ? 3.4 : 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  // 掴んでいる点のガイド
  if (grab.i >= 0) {
    const p = points[grab.i];
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(grab.x, grab.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(grab.x, grab.y, 9, 0, Math.PI * 2); ctx.stroke();
  }
}

/* ---------------- メインループ ---------------- */
let last = performance.now(), acc = 0, statTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dtms = now - last; last = now;
  if (dtms > 100) dtms = 100;
  acc += dtms / 1000 * timeScale;
  const h = 1 / 60 / SUBSTEPS;
  let n = 0;
  while (acc >= h && n < SUBSTEPS * 4) { stepPhysics(h); acc -= h; n++; }
  if (n >= SUBSTEPS * 4) acc = 0;
  updateStrain();
  draw();
  statTimer += dtms;
  if (statTimer > 200) {
    statTimer = 0;
    document.getElementById('statS').textContent = Math.round(maxStrain * 100) + '%';
  }
}
requestAnimationFrame(frame);

/* ---------------- 入力（マウス＋タッチ） ---------------- */
const grab = { i: -1, x: 0, y: 0 };
function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', (e) => {
  const pos = pointerPos(e);
  let best = -1, bd = 34;
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.pin) continue;
    const d = Math.hypot(p.x - pos.x, p.y - pos.y);
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0) {
    grab.i = best; grab.x = pos.x; grab.y = pos.y;
    cv.classList.add('grabbing');
    cv.setPointerCapture(e.pointerId);
  }
});
cv.addEventListener('pointermove', (e) => {
  if (grab.i < 0) return;
  const pos = pointerPos(e);
  grab.x = pos.x; grab.y = pos.y;
});
function endGrab() { grab.i = -1; cv.classList.remove('grabbing'); }
cv.addEventListener('pointerup', endGrab);
cv.addEventListener('pointercancel', endGrab);

/* ---------------- UI ---------------- */
document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentPreset = btn.dataset.preset;
    reset();
  });
});
const btnStress = document.getElementById('btnStress');
btnStress.addEventListener('click', () => {
  stressMode = !stressMode;
  btnStress.textContent = '応力表示: ' + (stressMode ? 'ON' : 'OFF');
  btnStress.classList.toggle('on', stressMode);
  document.getElementById('legend').style.display = stressMode ? 'block' : 'none';
});
const btnSlow = document.getElementById('btnSlow');
btnSlow.addEventListener('click', () => {
  const slow = timeScale === 1;
  timeScale = slow ? 0.12 : 1;
  btnSlow.textContent = 'スローモーション: ' + (slow ? 'ON' : 'OFF');
  btnSlow.classList.toggle('on', slow);
});
document.getElementById('btnReset').addEventListener('click', reset);

reset();
</script>
</body>
</html>
